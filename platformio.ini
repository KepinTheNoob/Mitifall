; PlatformIO Project Configuration - Mitifall wearable fall detection
;
; Three build environments share the same modules but have different entry
; points, so exactly one setup()/loop() pair is ever compiled:
;
;   pio run -e scanner      -t upload    I2C + actuator bring-up diagnostics
;   pio run -e raw_stream   -t upload    50 Hz 9-DoF CSV + Adafruit IO (MQTT)
;   pio run -e ml_inference -t upload    Random Forest inference + Blynk IoT
;
; Cloud credentials live in include/secrets.h (git-ignored) or in -D flags; see
; include/adafruit_io_config.h and include/blynk_config.h.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Without this, a bare `pio run` builds all three environments and
; `pio run -t upload` flashes them back to back. Commands with no -e now target
; the main application; change to raw_stream or scanner while bringing hardware up.
default_envs = scanner

[env]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200

; ESP32-C3 has no USB-UART bridge on this board: route the console over the
; native USB CDC peripheral so Serial works straight after boot.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit HMC5883 Unified @ ^1.2.3

; ---------------------------------------------------------------------------
; Bring-up: scan the bus, identify sensors, sweep pins, pulse the actuators
; ---------------------------------------------------------------------------
; build_src_filter is the PlatformIO 6 name for src_filter; the excluded entry
; points are what prevent "multiple definition of setup()/loop()".
[env:scanner]
build_src_filter = +<*.cpp> -<raw_stream_main.cpp> -<inference_main.cpp>

; ---------------------------------------------------------------------------
; Data capture + Adafruit IO telemetry over MQTT
; ---------------------------------------------------------------------------
[env:raw_stream]
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient @ ^2.8
build_src_filter = +<*.cpp> -<scanner_main.cpp> -<inference_main.cpp>

; ---------------------------------------------------------------------------
; Inference + Blynk IoT dashboard
; ---------------------------------------------------------------------------
[env:ml_inference]
lib_deps =
    ${env.lib_deps}
    blynkkk/Blynk @ ^1.3.2
build_src_filter = +<*.cpp> -<scanner_main.cpp> -<raw_stream_main.cpp>
