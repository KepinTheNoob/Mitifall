[platformio]
default_envs = scanner

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit HMC5883 Unified @ ^1.2.3

[env:scanner]
build_src_filter = +<*.cpp> -<raw_stream_main.cpp> -<inference_main.cpp> -<device_log.cpp>

[env:raw_stream]
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient @ ^2.8
    siara-cc/Sqlite3Esp32 @ ^2.5
board_build.partitions = partitions_log.csv
board_build.filesystem = littlefs
build_src_filter = +<*.cpp> -<scanner_main.cpp> -<inference_main.cpp>

[env:dl_stream]
extends = env:raw_stream
build_flags =
    ${env.build_flags}
    -D MITIFALL_DL_STREAM=1

[env:ml_inference]
build_src_filter = +<*.cpp> -<scanner_main.cpp> -<raw_stream_main.cpp> -<device_log.cpp>
